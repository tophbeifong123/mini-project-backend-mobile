# =============================================================================
# redis-cache — metadata cache ล้วน (architecture.md §1)
# ข้อมูลในนี้ "หายได้" เสมอ เพราะสร้างใหม่จาก DB ได้ → evict ได้ตามสบาย
# =============================================================================

port 6379
bind 0.0.0.0
protected-mode no

# แคชล้วน: เมื่อเต็มให้ทิ้งตัวที่ใช้น้อยสุด ไม่ต้องคืน error
maxmemory 256mb
maxmemory-policy allkeys-lru

# ไม่ต้อง persist — เป็นแคช ล้างแล้วสร้างใหม่ได้
save ""
appendonly no

# ปิด command อันตรายที่อาจบล็อก Redis ทั้งตัว (CLAUDE.md §6 — ห้าม KEYS)
rename-command KEYS ""
rename-command FLUSHALL ""

tcp-keepalive 60
timeout 0
