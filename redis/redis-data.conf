# =============================================================================
# redis-data — stock counter + in-flight lock + BullMQ jobs
# ⚠️ นี่คือ source of truth ชั่วคราวของสต็อก — ห้ามถูก evict เด็ดขาด
#    ถ้าเผลอตั้ง allkeys-lru: LRU จะลบ stock:* หรือ BullMQ job ทิ้งกลางการทดสอบ
#    → ระบบขายไม่ได้ / order หายเงียบๆ (CLAUDE.md §4.11, architecture.md §7)
# =============================================================================

port 6379
bind 0.0.0.0
protected-mode no

# ห้าม evict: เมื่อเต็มให้ตอบ error ออกมาดังๆ ดีกว่าลบข้อมูลเงียบๆ
maxmemory 512mb
maxmemory-policy noeviction

# ทนต่อการ restart: AOF everysec (BullMQ + stock counter ต้องไม่หาย)
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"
dir /data

# RDB snapshot สำรองอีกชั้น
save 900 1
save 300 10
save 60 10000

# หมายเหตุ: จงใจ "ไม่" rename-command KEYS ที่ instance นี้
#   BullMQ / Bull-Board เรียก command ระดับล่างเองหลายตัว การ rename ทิ้ง
#   เสี่ยงทำให้ queue พังแบบเงียบๆ — กฎ "ห้ามใช้ KEYS" บังคับที่โค้ดเรา (CLAUDE.md §6)

tcp-keepalive 60
timeout 0
