# =============================================================================
# Flash Sale System — Edge Layer (architecture.md §2 + §8)
# =============================================================================

worker_processes auto;

events {
    # architecture.md §8 — ต้องรองรับ 1,000 read VUs + 500 write VUs พร้อมกัน
    worker_connections 10240;
}

http {
    # -------------------------------------------------------------------------
    # Correlation ID ถูกกำหนดที่ "edge ที่เดียว" → ทุก instance เห็นค่าเดียวกัน
    #   client ส่ง X-Correlation-ID มา  → ใช้ค่าเดิม
    #   ไม่ส่งมา                        → nginx สร้างจาก $request_id (hex 32 ตัว)
    # backend อ่าน header นี้ใน CorrelationIdMiddleware แล้วส่งต่อเข้า job payload
    # -------------------------------------------------------------------------
    map $http_x_correlation_id $correlation_id {
        default   $http_x_correlation_id;
        ""        $request_id;
    }

    # access log เป็น single-line JSON เหมือนฝั่ง backend (CLAUDE.md §5.5)
    log_format json_combined escape=json
        '{'
        '"timestamp":"$time_iso8601",'
        '"level":"info",'
        '"instanceId":"nginx",'
        '"correlationId":"$correlation_id",'
        '"method":"$request_method",'
        '"url":"$request_uri",'
        '"status":$status,'
        '"upstream":"$upstream_addr",'
        '"upstreamStatus":"$upstream_status",'
        '"responseTime":$request_time,'
        '"upstreamTime":"$upstream_response_time",'
        '"msg":"proxied"'
        '}';

    access_log /dev/stdout json_combined;
    error_log  /dev/stderr warn;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;

    upstream backend {
        least_conn;                 # กระจายตาม in-flight connection จริง เหมาะกับ burst
        # ⚠️ max_fails=0 = ปิด passive health check โดยเจตนา
        # backend ทั้ง 6 ตัวเหมือนกันทุกอย่าง เวลาโหลดพีคมันจะช้าพร้อมกัน
        # ถ้าเปิด max_fails ไว้ nginx จะตัดออกครบทุกตัว → `no live upstreams`
        # → ตอบ 502 ทันทีทุก request จนกว่า fail_timeout จะหมด แล้ววนแบบนั้นไปเรื่อยๆ
        # ช้าแต่ได้คำตอบ ดีกว่าเร็วแต่ 502 — การจับ instance ตายเป็นหน้าที่ของ
        # healthcheck ใน docker-compose.yml ไม่ใช่ของ nginx free
        server app-1:3000 max_fails=0;
        server app-2:3000 max_fails=0;
        server app-3:3000 max_fails=0;
        server app-4:3000 max_fails=0;
        server app-5:3000 max_fails=0;
        server app-6:3000 max_fails=0;
        keepalive 128;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend;

            # ⚠️ บังคับ 2 บรรทัดนี้ ไม่งั้น `keepalive` ข้างบนไม่ทำงานเลย
            # Nginx จะคุย upstream ด้วย HTTP/1.0 + Connection: close
            # → TCP handshake ใหม่ทุก request (ตัวฉุด p95 อันดับ 1)
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ส่ง correlation id ต่อไปให้ backend + ส่งกลับให้ client
            proxy_set_header X-Correlation-ID  $correlation_id;
            add_header       X-Correlation-ID  $correlation_id always;

            # ⚠️ default ของ proxy_next_upstream คือ `error timeout` แปลว่า request
            # ที่ timeout จะถูกยิงซ้ำไป upstream ตัวถัดไปเอง → ตอนระบบเริ่มช้า
            # → retry เฉพาะตอนต่อไม่ติดจริงๆ เท่านั้น ไม่ retry ตอน timeout
            proxy_next_upstream error;

            # กัน upstream ค้างแล้วกิน worker_connections จนหมด
            proxy_connect_timeout 5s;
            proxy_send_timeout    10s;
            proxy_read_timeout    10s;
        }
    }
}
