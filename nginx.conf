# =============================================================================
# Flash Sale System — Edge Layer (architecture.md §2 + §8)
# =============================================================================

# ⚠️ ห้ามใช้ `auto` — `auto` อ่านจำนวน core ของ **โฮสต์** (16) ไม่ใช่ `cpus:` ของคอนเทนเนอร์
# nginx จึงเคยสร้าง 16 worker มาแย่งโควตา 0.5 core กันเอง = context switch ล้วนๆ
# ตั้งให้เท่ากับ `cpus:` ใน docker-compose.yml (1.0 -> 2 worker เผื่อ I/O wait)
worker_processes 2;
worker_rlimit_nofile 65535;

events {
    worker_connections 10240;
    multi_accept on;
}

http {
    map $http_x_correlation_id $correlation_id {
        default   $http_x_correlation_id;
        ""        $request_id;
    }

    log_format json_combined escape=json
        '{'
        '"timestamp":"$time_iso8601",'
        '"level":"info",'
        '"instanceId":"nginx",'
        '"correlationId":"$correlation_id",'
        '"method":"$request_method",'
        '"url":"$request_uri",'
        '"status":$status,'
        '"upstream":"$upstream_addr",'
        '"upstreamStatus":"$upstream_status",'
        '"responseTime":$request_time,'
        '"upstreamTime":"$upstream_response_time",'
        '"upstreamConnect":"$upstream_connect_time",'
        '"upstreamHeader":"$upstream_header_time",'
        '"msg":"proxied"'
        '}';

    access_log /dev/stdout json_combined buffer=64k flush=5s;
    error_log  /dev/stderr warn;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    # ⚠️ ปิดไว้โดยเจตนาสำหรับการยิงในวง LAN เดียวกัน — บนเครื่องที่ CPU ตันอยู่แล้ว
    # (385-391% จาก 400%) การบีบอัด JSON ทุก response ที่ ~2,100 rps เอา CPU ไป
    # จากสิ่งที่เป็นคอขวดจริง  **ถ้าไปยิงข้ามเครือข่ายที่แบนด์วิดท์จำกัด ให้เปิดกลับ**
    # (response ของ /api/v1/products บีบได้ ~3 เท่า) — เป็นการแลกคนละแบบ ไม่ใช่ผิด/ถูก
    gzip              off;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types        application/json;
    gzip_vary         on;
    server_tokens off;

    keepalive_timeout  65s;
    keepalive_requests 100000;

    upstream backend {
        least_conn;
        server app-1:3000 max_fails=0;
        server app-2:3000 max_fails=0;
        server app-3:3000 max_fails=0;
        server app-4:3000 max_fails=0;
        server app-5:3000 max_fails=0;
        server app-6:3000 max_fails=0;
        
        keepalive 768;
        keepalive_requests 100000;
        keepalive_timeout 65s;
    }

    server {
        listen 80 backlog=4096;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Correlation-ID  $correlation_id;
        add_header       X-Correlation-ID  $correlation_id always;

        proxy_next_upstream error;

        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        location / {
            proxy_pass http://backend;
        }
    }
}