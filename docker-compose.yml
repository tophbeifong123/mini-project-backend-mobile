      CATALOG_CACHE_TTL_BASE: "30"
      CATALOG_CACHE_TTL_JITTER: "30"
      ORDER_LOCK_TTL_MS: "30000"
      WORKER_CONCURRENCY: "1"
      ORDER_WORKER_ENABLED: "false"

      BULL_BOARD_USER: ${BULL_BOARD_USER:-admin}
      BULL_BOARD_PASSWORD: ${BULL_BOARD_PASSWORD:-admin}
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-data:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  # ===========================================================================
  # BullMQ worker — process แยกจาก API เพื่อ isolate event loop ตอน write burst
  # ไม่มี port และไม่อยู่ใน nginx upstream
  # ===========================================================================
  orders-worker:
    image: flash-sale-backend:latest
    container_name: fs-orders-worker
    restart: unless-stopped
    mem_limit: 256m
    # 50 jobs ใช้ worker time รวม ~3.1s; 0.25 core + concurrency 1 เพียงพอ
    # และกัน CPU ไว้ให้ API ที่ชนเพดาน 4 cores ระหว่าง 1,000-reader burst
    cpus: "0.25"
    command: ["node", "dist/worker.js"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=160 --max-semi-space-size=16"
      INSTANCE_ID: orders-worker

      JWT_SECRET: ${JWT_SECRET:-flash-sale-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}

      DB_HOST: postgres-primary
      DB_PORT: "5432"
      DB_USERNAME: ${DB_USERNAME:-${POSTGRES_USER:-flashsale}}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-flashsale}}
      DB_DATABASE: ${DB_DATABASE:-${POSTGRES_DB:-flashsale}}
      DB_REPLICA_HOST: postgres-replica
      DB_REPLICA_PORT: "5432"
      DB_POOL_SIZE: "8"

      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: "6379"
      REDIS_DATA_HOST: redis-data
      REDIS_DATA_PORT: "6379"

      CATALOG_CACHE_TTL_BASE: "30"
      CATALOG_CACHE_TTL_JITTER: "30"
      ORDER_LOCK_TTL_MS: "30000"
      WORKER_CONCURRENCY: "1"
      ORDER_WORKER_ENABLED: "true"

      BULL_BOARD_USER: ${BULL_BOARD_USER:-admin}
      BULL_BOARD_PASSWORD: ${BULL_BOARD_PASSWORD:-admin}
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-data:
        condition: service_healthy

  # ===========================================================================
  # Nginx — จุดเดียวที่ k6 ยิงเข้ามา (least_conn + keepalive, ดู nginx.conf)
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: fs-nginx
    restart: unless-stopped
    mem_limit: 128m
    # วัดจริง: ที่ 1,808 rps nginx ใช้ 0.44 core = 88% ของเพดานเดิม 0.5
    # ถ้าเร่งเฉพาะ app tier คอขวดจะย้ายมาที่นี่ทันที (ดู nginx.conf: worker_processes)
    cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
      app-3:
        condition: service_healthy
      app-4:
        condition: service_healthy
      app-5:
        condition: service_healthy
      app-6:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_primary_data:
  postgres_replica_data:
  redis_data_data:
