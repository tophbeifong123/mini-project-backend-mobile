# =============================================================================
# Flash Sale System — 1-click stack
#
#   podman compose up -d          # ยกทั้งระบบ (migration + seed ทำอัตโนมัติบน app-1)
#   podman compose ps             # ดูสถานะ + healthcheck
#   podman compose logs -f app-1
#   podman compose down           # หยุด (ข้อมูลยังอยู่ใน volume)
#   podman compose down -v        # ⚠️ ลบ volume ด้วย — ข้อมูล DB หายหมด (ต้องขออนุญาตก่อน)
#
# Topology (architecture.md §1):
#   k6 → nginx :8080 → app-1 … app-6 :3000
#                        ├─ postgres-primary :5432   (writes, atomic decrement)
#                        ├─ postgres-replica :5433   (catalog reads, streaming replication)
#                        ├─ redis-cache      :6379   (allkeys-lru — metadata cache)
#                        └─ redis-data       :6380   (noeviction + AOF — stock/lock/BullMQ)
#
# หมายเหตุ podman: ไฟล์นี้เลี่ยง syntax ที่เป็นของ docker โดยเฉพาะ
#   - ไม่ใช้ `depends_on.condition: service_completed_successfully`
#   - ไม่ใช้ YAML anchor / x-extension (เขียนซ้ำแบบตรงไปตรงมาแทน)
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Primary — รับ write ทั้งหมด และส่ง WAL ให้ standby
  # ===========================================================================
  postgres-primary:
    image: postgres:16-alpine
    container_name: fs-postgres-primary
    restart: unless-stopped
    mem_limit: 768m
    cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flashsale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flashsale}
      POSTGRES_DB: ${POSTGRES_DB:-flashsale}
      # อ่านโดย scripts/primary-init.sh (role + slot + pg_hba)
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replpass}
      REPLICATION_SLOT_NAME: ${REPLICATION_SLOT_NAME:-replica_1_slot}
    ports:
    # ⚠️ ผูกกับ 127.0.0.1 เท่านั้น — ห้ามเปลี่ยนกลับเป็น "PORT:PORT" เปล่าๆ
    # รหัส PG อยู่ในไฟล์นี้ตรงๆ และ redis ทั้งสองตัวไม่มี requirepass
    # เปิดทุก interface = ใครบน LAN ก็เขียน datastore ได้ตรงๆ
    #   Redis  -> ข้าม Tier 1 (gatekeeper) · Tier 3/4 ยังกัน oversell อยู่
    #   PG     -> ข้ามได้ทุกด่านจริง เพราะ Tier 3/4 อยู่ใน Postgres เอง
    # เครื่องมือฝั่งโฮสต์ (pnpm reset/seed, psql, redis-cli, cache-stats.sh) ใช้ localhost อยู่แล้ว จึงไม่กระทบ
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./scripts/primary-init.sh:/docker-entrypoint-initdb.d/10-primary-init.sh:ro
    command:
      - postgres
      # architecture.md §8 — 6 instances × pool 8 = 48 บน primary (และ 48 บน replica แยกกัน) ≤ 80% ของ 100
      - -c
      - max_connections=100
      # --- streaming replication ---
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - wal_keep_size=256MB
      - -c
      - max_slot_wal_keep_size=1GB
      - -c
      - track_commit_timestamp=on
      # --- tuning สำหรับ burst write ---
      - -c
      - shared_buffers=256MB
      - -c
      - synchronous_commit=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flashsale} -d ${POSTGRES_DB:-flashsale}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ===========================================================================
  # PostgreSQL Replica — hot standby (read-only) ใช้อ่าน catalog เท่านั้น
  # ⚠️ ห้ามอ่านข้อมูลที่ต้อง lock จากตัวนี้ (CLAUDE.md §6) — replication lag
  # ===========================================================================
  postgres-replica:
    image: postgres:16-alpine
    container_name: fs-postgres-replica
    restart: unless-stopped
    mem_limit: 640m
    cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PGPASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replpass}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      REPLICATION_SLOT_NAME: ${REPLICATION_SLOT_NAME:-replica_1_slot}
      PRIMARY_HOST: postgres-primary
      PRIMARY_PORT: 5432
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./scripts/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    depends_on:
      postgres-primary:
        condition: service_healthy
    entrypoint: ["bash", "/usr/local/bin/replica-entrypoint.sh"]
    command:
      - -c
      - hot_standby=on
      - -c
      - hot_standby_feedback=on
      # standby ต้องมี max_connections ไม่น้อยกว่า primary ไม่งั้นไม่ยอม start
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
    healthcheck:
      # ต้องพร้อมใช้งาน "และ" อยู่ในโหมด recovery จริง (คือ streaming อยู่)
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-flashsale} -d ${POSTGRES_DB:-flashsale} && psql -U ${POSTGRES_USER:-flashsale} -d ${POSTGRES_DB:-flashsale} -tAc 'SELECT pg_is_in_recovery()' | grep -q t
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  # ===========================================================================
  # Redis #1 — cache ล้วน (allkeys-lru) : metadata cache เท่านั้น
  # ===========================================================================
  redis-cache:
    image: redis:7-alpine
    container_name: fs-redis-cache
    restart: unless-stopped
    mem_limit: 320m
    cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./redis/redis-cache.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ===========================================================================
  # Redis #2 — data/queue (noeviction + AOF) : stock counter, lock, BullMQ
  # ⚠️ ถ้าตัวนี้ evict ข้อมูล = ระบบพังเงียบๆ (CLAUDE.md §4.11)
  # ===========================================================================
  redis-data:
    image: redis:7-alpine
    container_name: fs-redis-data
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - ./redis/redis-data.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data_data:/data
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ===========================================================================
  # NestJS app-1 — เป็นตัวเดียวที่รัน migration + seed (RUN_MIGRATIONS=true)
  # ไม่ publish port ออก host: เข้าถึงผ่าน nginx :8080 เท่านั้น
  # ===========================================================================
  app-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: flash-sale-backend:latest
    container_name: fs-app-1
    restart: unless-stopped
    mem_limit: 512m
    # One Node.js process can use one vCPU when busy.  The previous 0.75 quota
    # throttled every API instance during the 1,000-reader burst even when the
    # host scheduler still had capacity on another core.
    cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      # --max-semi-space-size=32 : young generation ใหญ่ขึ้น -> scavenge ถี่น้อยลง
      # วัดจริง (1 instance / 1.0 CPU / ยิงตรง): 494 -> 718 rps (+45%) · peak RSS 141MiB < 512m
      # ที่มา: CPU profile ชี้ว่า GC กิน 21.4% ของ CPU ทั้งหมดบน read path
      NODE_OPTIONS: "--max-old-space-size=384 --max-semi-space-size=32"
      PORT: "3000"
      INSTANCE_ID: app-1
      # migration + seed DB + seed Redis stock ทำที่ instance นี้เท่านั้น
      RUN_MIGRATIONS: "true"

      JWT_SECRET: ${JWT_SECRET:-flash-sale-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}

      DB_HOST: postgres-primary
      DB_PORT: "5432"
      DB_USERNAME: ${DB_USERNAME:-${POSTGRES_USER:-flashsale}}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-flashsale}}
      DB_DATABASE: ${DB_DATABASE:-${POSTGRES_DB:-flashsale}}
      DB_REPLICA_HOST: postgres-replica
      DB_REPLICA_PORT: "5432"
      DB_POOL_SIZE: "8"

      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: "6379"
      REDIS_DATA_HOST: redis-data
      REDIS_DATA_PORT: "6379"

      CATALOG_CACHE_TTL_BASE: "30"
      CATALOG_CACHE_TTL_JITTER: "30"
      ORDER_LOCK_TTL_MS: "30000"
      # API process ไม่สร้าง BullMQ consumer (ดู ORDER_WORKER_ENABLED)
      # ค่า concurrency นี้จึงเป็น safety/default เท่านั้น; consumer จริงอยู่ orders-worker
      WORKER_CONCURRENCY: "1"
      ORDER_WORKER_ENABLED: "false"

      BULL_BOARD_USER: ${BULL_BOARD_USER:-admin}
      BULL_BOARD_PASSWORD: ${BULL_BOARD_PASSWORD:-admin}
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-data:
        condition: service_healthy
    healthcheck:
      # /health/live ต้องไม่แตะ DB (CLAUDE.md §5.4)
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

